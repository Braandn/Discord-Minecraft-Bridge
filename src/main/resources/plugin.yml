name: MajesticBot
main: bot.majestic.MajesticBot
version: '${project.version}'
api-version: '1.17'
author: braandn
website: https://majestic.bot
description: Bridges your Minecraft server and Discord through Majestic Bot or a Discord webhook.

commands:
  majestic:
    description: Reload MajesticBot or show its connection status.
    usage: /<command> <reload|status>

permissions:
  majestic.reload:
    description: Reload config.yml and reconnect.
    default: op
  majestic.status:
    description: Show the connection status.
    default: op
  majestic.update:
    description: Get told in game when a new plugin version is out.
    default: op
