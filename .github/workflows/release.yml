name: Release MajesticBot
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One jar per line, built against the newest API of that line. Paper 26.x numbers
          # builds as <version>.build.<n>-<channel>, so the range picks the newest build of 26.3.
          - paper_version: '[26.3.build,26.4)'
            mc_version: '26.3'
            java_version: '25'
          - paper_version: '1.21.11-R0.1-SNAPSHOT'
            mc_version: '1.21.11'
            java_version: '21'
          - paper_version: '1.20.4-R0.1-SNAPSHOT'
            mc_version: '1.20.4'
            java_version: '17'
          - paper_version: '1.19.4-R0.1-SNAPSHOT'
            mc_version: '1.19.4'
            java_version: '17'
          - paper_version: '1.18.2-R0.1-SNAPSHOT'
            mc_version: '1.18.2'
            java_version: '17'
          - paper_version: '1.17.1-R0.1-SNAPSHOT'
            mc_version: '1.17.1'
            java_version: '17'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK ${{ matrix.java_version }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java_version }}
        distribution: 'temurin'
        cache: maven

    - name: Resolve version
      id: version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "revision=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        else
          echo "revision=0.0.0-SNAPSHOT" >> "$GITHUB_OUTPUT"
        fi

    - name: Build with Maven
      run: >
        mvn -B clean package
        "-Dpaper.version=${{ matrix.paper_version }}"
        -Dmc.version=${{ matrix.mc_version }}
        -Djava.version=${{ matrix.java_version }}
        -Drevision=${{ steps.version.outputs.revision }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jar-${{ matrix.mc_version }}
        path: target/majesticbot-*.jar
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Extract changelog for this version
      run: |
        # Everything between the first "## [x.y.z]" header and the next one.
        awk '/^## \[/{if(found) exit; found=1; next} found' CHANGELOG.md > release_notes.md
        cat release_notes.md

    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: jar-*
        path: downloaded-jars
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: downloaded-jars/*.jar
        body_path: release_notes.md
